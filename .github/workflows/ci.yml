name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weixtrom
          POSTGRES_PASSWORD: weixtrom_ci
          POSTGRES_DB: weixtrom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@weixtrom/shared

      - name: Lint check
        run: npm run format:check

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://weixtrom:weixtrom_ci@localhost:5432/weixtrom_test
        run: npx prisma migrate deploy

      - name: Build API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://weixtrom:weixtrom_ci@localhost:5432/weixtrom_test
        run: npm run build

      - name: Build Web
        working-directory: apps/web
        run: npm run build

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weixtrom
          POSTGRES_PASSWORD: weixtrom_ci
          POSTGRES_DB: weixtrom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@weixtrom/shared

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://weixtrom:weixtrom_ci@localhost:5432/weixtrom_test
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://weixtrom:weixtrom_ci@localhost:5432/weixtrom_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
        run: npm test --if-present
