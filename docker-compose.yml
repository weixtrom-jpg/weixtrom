services:
  postgres:
    image: postgres:16-alpine
    container_name: weixtrom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weixtrom
      POSTGRES_PASSWORD: weixtrom_dev
      POSTGRES_DB: weixtrom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
